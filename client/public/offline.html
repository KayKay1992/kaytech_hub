<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10142B" />
    <title>You're Offline | KayTech Hub</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Kept deliberately self-contained (no build-hashed CSS/JS) since
         this is the last-resort page served when nothing else is
         reachable — it has to work with zero network and zero bundle. */
      :root {
        color-scheme: light dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        font-family: 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;
        background: #f5f6fa;
        color: #10142b;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #14172c; color: #eef0fa; }
        .card { background: #1c2142 !important; border-color: #2a2f52 !important; }
        .muted { color: #9aa1c2 !important; }
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e4ee;
        border-radius: 16px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 16px 40px rgba(16, 20, 43, 0.08);
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #10142b;
      }
      h1 {
        font-family: 'Clash Display', 'Poppins', system-ui, sans-serif;
        font-size: 1.5rem;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.6;
      }
      .muted { color: #5b6072; }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 12px 28px;
        border-radius: 10px;
        background: #ffb020;
        color: #10142b;
      }
      button:hover { box-shadow: 0 10px 24px rgba(255, 176, 32, 0.35); }
      .status {
        margin-top: 20px;
        font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
        font-size: 0.78rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #5b6072;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg width="28" height="28" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#FFB020" stroke-width="9" stroke-linecap="square" fill="none">
            <line x1="22" y1="16" x2="22" y2="48"/>
            <line x1="22" y1="32" x2="46" y2="14"/>
            <line x1="22" y1="32" x2="46" y2="50"/>
          </g>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p class="muted">
        We couldn't reach KayTech Hub and this page hasn't been saved for offline use yet.
        Check your connection and try again — anything you've already visited should still load.
      </p>
      <button onclick="window.location.reload()">Try Again</button>
      <p class="status" id="status">Waiting for connection...</p>
    </div>
    <script>
      // Auto-retry the instant the browser reports we're back online,
      // instead of leaving the user to remember to reload manually.
      window.addEventListener('online', function () { window.location.reload(); });
      document.getElementById('status').textContent = navigator.onLine
        ? 'Connection detected — try reloading.'
        : 'Waiting for connection...';
    </script>
  </body>
</html>
